<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" role="img" aria-label="Karala ana sayfa" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Karala – ana sayfa</title>
  <defs>
    <style>
      text { font-family: -apple-system, 'SF Pro Text', 'SF Pro Display', 'Inter', 'Helvetica Neue', Arial, sans-serif; }
    </style>
    <filter id="cover" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#14183A" flood-opacity="0.16"/>
    </filter>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="1" stdDeviation="4" flood-color="#14183A" flood-opacity="0.06"/>
    </filter>
    <filter id="fab" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#2F4BFF" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="390" height="844" fill="#F4F5F9"/>

  <!-- durum çubuğu -->
  <text x="34" y="31" font-size="15" font-weight="600" fill="#14183A">12:07</text>
  <g fill="#14183A">
    <rect x="318" y="22" width="3" height="8" rx="1"/><rect x="324" y="19" width="3" height="11" rx="1"/><rect x="330" y="16" width="3" height="14" rx="1"/>
    <rect x="341" y="17" width="25" height="13" rx="4" fill="none" stroke="#14183A" stroke-opacity="0.45" stroke-width="1.2"/>
    <rect x="343" y="19" width="16" height="9" rx="2.5"/>
  </g>

  <!-- üst çubuk -->
  <text x="24" y="84" font-size="22" font-weight="700" fill="#14183A" letter-spacing="-0.4">Karala</text>
  <g>
    <circle cx="302" cy="76" r="19" fill="#FFFFFF" filter="url(#soft)"/>
    <!-- görünüm -->
    <g fill="none" stroke="#14183A" stroke-width="1.8" stroke-linejoin="round">
      <rect x="294" y="68" width="6.5" height="6.5" rx="1.8"/><rect x="303.5" y="68" width="6.5" height="6.5" rx="1.8"/>
      <rect x="294" y="77.5" width="6.5" height="6.5" rx="1.8"/><rect x="303.5" y="77.5" width="6.5" height="6.5" rx="1.8"/>
    </g>
    <circle cx="350" cy="76" r="19" fill="#FFFFFF" filter="url(#soft)"/>
    <!-- ayarlar -->
    <g fill="none" stroke="#14183A">
      <circle cx="350" cy="76" r="8.6" stroke-width="3.2" stroke-dasharray="3.3 3.2"/>
      <circle cx="350" cy="76" r="6.2" stroke-width="1.8"/>
      <circle cx="350" cy="76" r="2.4" stroke-width="1.8"/>
    </g>
  </g>

  <!-- defterlerim -->
  <text x="24" y="150" font-size="28" font-weight="700" fill="#14183A" letter-spacing="-0.6">Defterlerim</text>
  <text x="366" y="149" font-size="15" font-weight="500" fill="#2F4BFF" text-anchor="end">Tümü</text>

  <!-- edebiyat -->
  <g filter="url(#cover)">
    <rect x="24" y="174" width="124" height="156" rx="12" fill="#3D5AFE"/>
  </g>
  <line x1="36" y1="174" x2="36" y2="330" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.2"/>
  <path d="M52 286 q7 -9 14 0 t14 0 t14 0 M52 302 q9 -7 18 0 t14 0" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="2.2" stroke-linecap="round"/>
  <text x="24" y="354" font-size="15" font-weight="600" fill="#14183A">Edebiyat</text>
  <text x="24" y="372" font-size="13" fill="#7A8099">24 sayfa</text>

  <!-- fizik -->
  <g filter="url(#cover)">
    <rect x="166" y="174" width="124" height="156" rx="12" fill="#F2D45C"/>
  </g>
  <line x1="178" y1="174" x2="178" y2="330" stroke="#14183A" stroke-opacity="0.12" stroke-width="1.2"/>
  <path d="M194 286 q7 -9 14 0 t14 0 t14 0 M194 302 q9 -7 18 0 t14 0" fill="none" stroke="#14183A" stroke-opacity="0.82" stroke-width="2.2" stroke-linecap="round"/>
  <text x="166" y="354" font-size="15" font-weight="600" fill="#14183A">Fizik</text>
  <text x="166" y="372" font-size="13" fill="#7A8099">41 sayfa</text>

