  <g filter="url(#cover)">
    <rect x="308" y="174" width="124" height="156" rx="12" fill="#F2A8C0"/>
  </g>
  <line x1="320" y1="174" x2="320" y2="330" stroke="#14183A" stroke-opacity="0.12" stroke-width="1.2"/>
  <path d="M336 286 q7 -9 14 0 t14 0 t14 0 M336 302 q9 -7 18 0 t14 0" fill="none" stroke="#14183A" stroke-opacity="0.82" stroke-width="2.2" stroke-linecap="round"/>
  <text x="308" y="354" font-size="15" font-weight="600" fill="#14183A">Şarkılar</text>
  <text x="308" y="372" font-size="13" fill="#7A8099">9 sayfa</text>

  <!-- son notlar -->
  <text x="24" y="430" font-size="28" font-weight="700" fill="#14183A" letter-spacing="-0.6">Son notlar</text>

  <rect x="20" y="450" width="350" height="216" rx="22" fill="#FFFFFF" filter="url(#soft)"/>

  <!-- not 1 -->
  <rect x="34" y="458" width="44" height="56" rx="7" fill="#F4F5F9" stroke="#E3E5EE"/>
  <path d="M42 474 q6 -6 12 0 t12 0 M42 485 q8 -5 14 0 t10 0 M42 496 q6 -4 10 0" fill="none" stroke="#3D5AFE" stroke-width="1.8" stroke-linecap="round"/>
  <text x="94" y="482" font-size="16" font-weight="600" fill="#14183A">Tarih tekrar listesi</text>
  <text x="94" y="502" font-size="13" fill="#7A8099">Edebiyat</text>
  <text x="356" y="482" font-size="13" fill="#9AA0B6" text-anchor="end">14:20</text>
  <line x1="94" y1="522" x2="356" y2="522" stroke="#ECEEF4" stroke-width="1"/>

  <!-- not 2 -->
  <rect x="34" y="530" width="44" height="56" rx="7" fill="#F4F5F9" stroke="#E3E5EE"/>
  <path d="M42 546 h26 M42 557 q6 -6 12 0 t12 0 M42 568 q10 -5 22 0" fill="none" stroke="#3D5AFE" stroke-width="1.8" stroke-linecap="round"/>
  <text x="94" y="554" font-size="16" font-weight="600" fill="#14183A">Köprü kısmı için fikirler</text>
  <text x="94" y="574" font-size="13" fill="#7A8099">Şarkılar</text>
  <text x="356" y="554" font-size="13" fill="#9AA0B6" text-anchor="end">Salı</text>
  <line x1="94" y1="594" x2="356" y2="594" stroke="#ECEEF4" stroke-width="1"/>

  <!-- not 3 -->
  <rect x="34" y="602" width="44" height="56" rx="7" fill="#F4F5F9" stroke="#E3E5EE"/>
  <path d="M42 618 q6 -6 12 0 t12 0 M42 629 q10 -5 16 0 M42 640 q8 -4 14 0 t8 0" fill="none" stroke="#3D5AFE" stroke-width="1.8" stroke-linecap="round"/>
  <text x="94" y="626" font-size="16" font-weight="600" fill="#14183A">Tork soruları, çözümler</text>
  <text x="94" y="646" font-size="13" fill="#7A8099">Fizik</text>
  <text x="356" y="626" font-size="13" fill="#9AA0B6" text-anchor="end">Pzt</text>

  <!-- yeni defter butonu -->
  <circle cx="334" cy="706" r="28" fill="#2F4BFF" filter="url(#fab)"/>
  <g transform="rotate(45 334 706)">
    <rect x="328.5" y="692" width="11" height="22" rx="2.5" fill="#FFFFFF"/>
    <path d="M328.5 716 h11 l-5.5 9 z" fill="#FFFFFF" fill-opacity="0.75"/>
  </g>

  <!-- alt sekme çubuğu -->
  <rect x="0" y="752" width="390" height="92" fill="#FFFFFF" fill-opacity="0.94"/>
  <line x1="0" y1="752.5" x2="390" y2="752.5" stroke="#E3E5EE"/>

  <!-- ana sayfa (seçili) -->
  <path d="M38 786 l11 -10 l11 10 v11 a2 2 0 0 1 -2 2 h-4 v-7 h-10 v7 h-4 a2 2 0 0 1 -2 -2 z" fill="#2F4BFF"/>
  <text x="49" y="818" font-size="10.5" font-weight="600" fill="#2F4BFF" text-anchor="middle">Ana sayfa</text>

  <!-- defterler -->
  <g fill="none" stroke="#9AA0B6" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round">
    <rect x="137" y="775" width="18" height="24" rx="3.5"/>
    <path d="M142 775 v24 M146 784 h5"/>
  </g>
  <text x="146" y="818" font-size="10.5" font-weight="500" fill="#9AA0B6" text-anchor="middle">Defterler</text>

  <!-- ara -->
  <g fill="none" stroke="#9AA0B6" stroke-width="1.9" stroke-linecap="round">
    <circle cx="242" cy="785" r="8"/>
    <path d="M248 791 l6 6"/>
  </g>
  <text x="244" y="818" font-size="10.5" font-weight="500" fill="#9AA0B6" text-anchor="middle">Ara</text>

  <!-- profil -->
  <g fill="none" stroke="#9AA0B6" stroke-width="1.9" stroke-linecap="round">
    <circle cx="341" cy="781" r="5.5"/>
    <path d="M331 798 q10 -12 20 0"/>
  </g>
  <text x="341" y="818" font-size="10.5" font-weight="500" fill="#9AA0B6" text-anchor="middle">Profil</text>

  <rect x="140" y="833" width="110" height="5" rx="2.5" fill="#14183A"/>
