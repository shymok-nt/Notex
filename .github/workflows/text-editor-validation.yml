name: Text editor validation
on:
  pull_request:
    paths:
      - 'features/canvas/**'
      - '.github/workflows/text-editor-validation.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --test features/canvas/engine/__tests__/*.test.mjs
